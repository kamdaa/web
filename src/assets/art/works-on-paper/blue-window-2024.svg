  <line x1="300" y1="440" x2="1080" y2="440" stroke="#556445" stroke-width="1" opacity="0.35"/>
  <line x1="690" y1="198" x2="690" y2="682" stroke="#556445" stroke-width="1" opacity="0.25"/>
  <circle cx="1140" cy="836" r="99" fill="#cf9369" opacity="0.55"/>
