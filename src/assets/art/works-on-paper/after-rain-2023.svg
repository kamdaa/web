  <path d="M 288 1230
           L 288 822
           A 312 312 0 0 1 912 822
           L 912 1230"
        fill="none" stroke="#566647" stroke-width="1.5" opacity="0.45"/>
  <circle cx="840" cy="750" r="81.60000000000001" fill="#d79b73" opacity="0.9"/>
  <line x1="120" y1="1350" x2="1080" y2="1350" stroke="#566647" stroke-width="1.2" opacity="0.35"/>
  <rect x="156" y="195" width="108" height="108" fill="#d79b73" opacity="0.35"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:multiply"/>
</svg>
