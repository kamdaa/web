  <circle cx="840" cy="800" r="81.60000000000001" fill="#c98459" opacity="0.9"/>
  <line x1="120" y1="1440" x2="1080" y2="1440" stroke="#4f5f42" stroke-width="1.2" opacity="0.35"/>
  <rect x="156" y="208" width="108" height="108" fill="#c98459" opacity="0.35"/>
