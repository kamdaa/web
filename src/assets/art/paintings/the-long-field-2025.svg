  <line x1="162" y1="621.3048769347369" x2="1638" y2="621.3048769347369" stroke="#66744f" stroke-width="1.4" opacity="0.5"/>
  <circle cx="1260" cy="330" r="85" fill="#ce8f66" opacity="0.9"/>
  <path d="M 252.00000000000003 240 Q 540 60 792 270" fill="none" stroke="#66744f" stroke-width="1.2" opacity="0.32"/>
  <rect x="162" y="840" width="288" height="6" fill="#66744f" opacity="0.3"/>
