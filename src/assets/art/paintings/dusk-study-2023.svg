  </g>
  <line x1="448.00000000000006" y1="120" x2="448.00000000000006" y2="1080" stroke="#566647" stroke-width="1.1" opacity="0.4"/>
  <circle cx="1152" cy="312" r="42.00000000000001" fill="#566647" opacity="0.65"/>
